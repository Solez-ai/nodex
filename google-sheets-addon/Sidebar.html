<!DOCTYPE html>
<!--
  Nodex for Google Sheets — Sidebar
  =================================
  This file is served by Apps Script (HtmlService) as the add-on sidebar.
  It reads the user's selected range via google.script.run, renders it as an
  interactive layered graph (Cytoscape.js + ELK layout), and offers CSV
  export plus a deep link into the full Nodex web app.

  Local preview without Apps Script: open with ?preview=1
  (e.g. https://your-server/google-sheets-addon/Sidebar.html?preview=1)
-->
<html>
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #2f3136;
        --bg-elev: #36393f;
        --bg-deep: #202225;
        --border: #424242;
        --text: #dcddde;
        --muted: #8b8e90;
        --accent: #59b8ff;
        --blurple: #5865f2;
        --amber: #faa81a;
        --danger: #f85c50;
        --ok: #00dc7d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-size: 13px;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      /* ── Header ─────────────────────────────────────────── */
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        background: var(--bg-deep);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 700;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }

      .brand .logo {
        color: var(--blurple);
        font-size: 15px;
        line-height: 1;
      }

      .brand .sub {
        color: var(--muted);
        font-weight: 500;
        font-size: 11px;
      }

      .range-info {
        color: var(--muted);
        font-size: 11px;
        font-family: Consolas, Menlo, monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 45%;
      }

      /* ── Controls ───────────────────────────────────────── */
      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        background: var(--bg-elev);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
        font-size: 12px;
        color: var(--text);
      }

      .toggle input {
        accent-color: var(--blurple);
        margin: 0;
        cursor: pointer;
      }

      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--bg-deep);
        color: var(--text);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 120ms ease, border-color 120ms ease, color 120ms ease;
        white-space: nowrap;
      }

      .btn:hover:not(:disabled) {
        background: #3a3d44;
        border-color: var(--muted);
      }

      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }

      .btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .btn.primary {
        background: var(--blurple);
        border-color: var(--blurple);
        color: #fff;
      }

      .btn.primary:hover:not(:disabled) {
        background: #6b75f4;
        border-color: #6b75f4;
      }

      /* ── Status ─────────────────────────────────────────── */
      .status {
        padding: 10px 12px;
        font-size: 12px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .status.hidden {
        display: none;
      }

      .status.error {
        color: var(--danger);
        background: rgba(248, 92, 80, 0.08);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .status.loading {
        color: var(--muted);
      }

      .status.empty {
        color: var(--muted);
      }

      /* ── Graph ──────────────────────────────────────────── */
      .cy-wrap {
        position: relative;
        flex: 1;
        min-height: 260px;
        background:
          linear-gradient(var(--bg-deep) 1.5px, transparent 1.5px),
          linear-gradient(90deg, var(--bg-deep) 1.5px, transparent 1.5px),
          linear-gradient(#26282c 1px, transparent 1px),
          linear-gradient(90deg, #26282c 1px, transparent 1px);
        background-size:
          100px 100px,
          100px 100px,
          20px 20px,
          20px 20px;
        background-color: #141414;
      }

      .cy-wrap.hidden {
        display: none;
      }

      #cy {
        width: 100%;
        height: 100%;
        display: block;
      }

      .cy-toolbar {
        position: absolute;
        top: 8px;
        right: 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        z-index: 5;
      }

      .cy-toolbar .btn {
        width: 28px;
        height: 26px;
        padding: 0;
        text-align: center;
        font-size: 14px;
        line-height: 1;
      }

      .cy-hint {
        position: absolute;
        bottom: 8px;
        left: 10px;
        right: 10px;
        color: var(--muted);
        font-size: 10px;
        text-align: center;
        pointer-events: none;
        z-index: 5;
      }

      /* ── Preview table ──────────────────────────────────── */
      .preview {
        --ph: 220px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg-elev);
        border-top: 1px solid var(--border);
      }

      /* Only reserve the drag-resized height while the preview is open;
         a closed <details> must collapse to just its summary bar. */
      .preview[open] {
        height: var(--ph);
      }

      /* Drag handle between the graph and the preview table */
      .preview-handle {
        height: 8px;
        flex-shrink: 0;
        cursor: ns-resize;
        touch-action: none;
        user-select: none;
      }

      .preview-handle::after {
        content: "";
        display: block;
        height: 2px;
        margin: 3px 12px 0;
        border-radius: 1px;
        background: var(--border);
        transition: background 120ms ease;
      }

      .preview-handle:hover::after,
      .preview-handle:active::after {
        background: var(--accent);
      }

      .preview.hidden {
        display: none;
      }

      .preview summary {
        padding: 6px 12px;
        cursor: pointer;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        user-select: none;
        list-style: none;
        flex-shrink: 0;
      }

      .preview summary::-webkit-details-marker {
        display: none;
      }

      .preview summary::before {
        content: "▸ ";
        color: var(--accent);
      }

      .preview[open] summary::before {
        content: "▾ ";
      }

      .preview-scroll {
        overflow: auto;
        flex: 1;
      }

      .preview table {
        border-collapse: collapse;
        width: max-content;
        min-width: 100%;
        font-size: 11px;
        font-family: Consolas, Menlo, monospace;
      }

      .preview th,
      .preview td {
        border: 1px solid var(--border);
        padding: 3px 8px;
        white-space: nowrap;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .preview th {
        background: var(--bg-deep);
        color: var(--accent);
        font-weight: 700;
        position: sticky;
        top: 0;
      }

      .preview td {
        color: var(--text);
      }

      /* ── Footer ─────────────────────────────────────────── */
      .actions {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: var(--bg-deep);
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        flex-wrap: wrap;
      }

      .dims {
        color: var(--muted);
        font-size: 11px;
        font-family: Consolas, Menlo, monospace;
        margin-right: auto;
        white-space: nowrap;
      }

      /* ── Toast ──────────────────────────────────────────── */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 56px;
        transform: translateX(-50%);
        background: #4d4d4d;
        color: #b9bbbe;
        border-radius: 4px;
        padding: 8px 14px;
        font-size: 12px;
        z-index: 50;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        opacity: 1;
        transition: opacity 250ms ease;
        max-width: 90%;
        text-align: center;
      }

      .toast.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .toast.ok {
        color: var(--ok);
      }

      .toast.error {
        color: var(--danger);
      }

      /* ── Expanded (full-height graph) mode ─────────────── */
      #app.expanded .app-header,
      #app.expanded .controls,
      #app.expanded .status:not(.error),
      #app.expanded .preview,
      #app.expanded .actions {
        display: none !important;
      }

      /* ── Standalone pop-out window ─────────────────────── */
      /* In the large standalone window the deep-link actions make no sense. */
      body.standalone #popOutBtn,
      body.standalone #openNodexBtn {
        display: none;
      }

      #cy {
        cursor: grab;
      }

      #cy:active {
        cursor: grabbing;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="logo">⬡</span>
          <span>Nodex</span>
          <span class="sub">for Google Sheets</span>
        </div>
        <div id="rangeInfo" class="range-info">—</div>
      </header>

      <div class="controls">
        <label class="toggle" title="Treat the first selected row as column names">
          <input type="checkbox" id="hasHeader" checked />
          First row is header
        </label>
        <button id="refreshBtn" class="btn">⟳ Refresh</button>
      </div>

      <div id="status" class="status loading hidden"></div>

      <div id="cyWrap" class="cy-wrap hidden">
        <div id="cy"></div>
        <div class="cy-toolbar">
          <button id="expandBtn" class="btn" title="Expand graph">⛶</button>
          <button id="fitBtn" class="btn" title="Fit graph">⤢</button>
          <button id="zoomInBtn" class="btn" title="Zoom in">+</button>
          <button id="zoomOutBtn" class="btn" title="Zoom out">−</button>
        </div>
        <div class="cy-hint">Click a row node to select that row in the sheet · scroll to zoom · drag to pan</div>
      </div>

      <details id="preview" class="preview hidden">
        <div id="previewHandle" class="preview-handle" title="Drag to resize preview"></div>
        <summary>Table preview</summary>
        <div class="preview-scroll">
          <div id="previewBody"></div>
        </div>
      </details>

      <footer class="actions">
        <span id="dims" class="dims"></span>
        <button
          id="popOutBtn"
          class="btn"
          title="Open the visualization in a large, freely resizable window"
        >
          ⇱ Pop out
        </button>
        <button id="openNodexBtn" class="btn primary">Open in Nodex</button>
        <button id="copyCsvBtn" class="btn">Copy CSV</button>
        <button id="downloadCsvBtn" class="btn">Download</button>
      </footer>
    </div>

    <div id="toast" class="toast hidden"></div>

    <!-- Interactive graph engine (HTTPS CDNs, allowed inside the sidebar sandbox) -->
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/elkjs@0.9.2/lib/elk.bundled.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape-elk@2.3.0/cytoscape-elk.min.js"></script>

    <!--
      ─────────────────────────────────────────────────────────────
      CORE (pure, testable) — no DOM / no google.* dependencies.
      Unit tests in test/run-core-tests.mjs target this block.
      ─────────────────────────────────────────────────────────────
    -->
    <script id="nodex-core">
      window.__nodexCore = (function () {
        "use strict";

        /**
         * Lenient RFC 4180 CSV parser. Handles quoted fields, escaped quotes
         * (""), embedded commas, and LF / CRLF line endings.
         * @param {string} csv
         * @returns {string[][]}
         */
        function csvToRows(csv) {
          const rows = [];
          let row = [];
          let field = "";
          let inQuotes = false;

          const finalize = function () {
            if (row.length > 0 || field.length > 0) {
              row.push(field);
              rows.push(row);
            }
            row = [];
            field = "";
          };

          for (let i = 0; i < csv.length; i++) {
            const ch = csv[i];
            if (inQuotes) {
              if (ch === '"') {
                if (csv[i + 1] === '"') {
                  field += '"';
                  i++;
                } else {
                  inQuotes = false;
                }
              } else {
                field += ch;
              }
            } else if (ch === '"') {
              inQuotes = true;
            } else if (ch === ",") {
              row.push(field);
              field = "";
            } else if (ch === "\n") {
              finalize();
            } else if (ch === "\r") {
              // ignore — CR is handled when the LF arrives
            } else {
              field += ch;
            }
          }
          finalize();
          return rows;
        }

        /**
         * 0-based column index → spreadsheet letters (0 → "A", 25 → "Z", 26 → "AA").
         * @param {number} index
         * @returns {string}
         */
        function columnToLetter(index) {
          let n = index + 1;
          let s = "";
          while (n > 0) {
            const rem = (n - 1) % 26;
            s = String.fromCharCode(65 + rem) + s;
            n = Math.floor((n - 1) / 26);
          }
          return s;
        }

        /**
         * Makes header names unique and non-empty. Empty cells become
         * "Column A" style names; duplicates get _2, _3 suffixes.
         * @param {string[]} headers
         * @returns {string[]}
         */
        function dedupeHeaders(headers) {
          const seen = {};
          return headers.map(function (h, i) {
            const base = String(h === null || h === undefined ? "" : h).trim();
            const key = base.length > 0 ? base : "Column " + columnToLetter(i);
            let name = key;
            let n = 2;
            while (seen[name]) {
              name = key + "_" + n;
              n++;
            }
            seen[name] = true;
            return name;
          });
        }

        /**
         * Normalizes raw CSV into a table shape.
         * Trailing fully-empty rows are dropped.
         * @param {string} csv
         * @param {boolean} hasHeader
         * @returns {{headers: string[] | null, dataRows: string[][], totalRows: number}}
         *          headers is null when hasHeader is false.
         */
        function normalizeTable(csv, hasHeader) {
          const parsed = csvToRows(csv);
          const rows = [];
          for (let i = 0; i < parsed.length; i++) {
            const r = parsed[i];
            const isEmpty = r.length === 0 || r.every(function (c) {
              return String(c).trim() === "";
            });
            if (isEmpty && i === parsed.length - 1) continue; // drop trailing empties
            rows.push(r);
          }

          if (!hasHeader || rows.length === 0) {
            return { headers: null, dataRows: rows, totalRows: rows.length };
          }

          return {
            headers: dedupeHeaders(rows[0]),
            dataRows: rows.slice(1),
            totalRows: rows.length,
          };
        }

        /**
         * Truncates a string to n chars, appending "…".
         * @param {string} s
         * @param {number} n
         * @returns {string}
         */
        function truncate(s, n) {
          const str = String(s === null || s === undefined ? "" : s);
          if (str.length <= n) return str;
          return str.slice(0, Math.max(0, n - 1)) + "…";
        }

        /**
         * Best-effort type detection for CSV cell values, mirroring how the
         * Nodex web app types values after its CSV→JSON conversion
         * (json-2-csv): numeric strings → number, "true"/"false" → boolean,
         * literal "null" → null, everything else → string.
         * @param {*} value
         * @returns {"number" | "boolean" | "null" | "string"}
         */
        function valueType(value) {
          var v = String(value === null || value === undefined ? "" : value).trim();
          if (v === "true" || v === "false") return "boolean";
          if (v === "null") return "null";
          if (v !== "" && /^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(v)) return "number";
          return "string";
        }

        /**
         * Monospace text-width estimate (px) used to size SVG nodes before
         * rendering (stands in for the web app's canvas measurement).
         * @param {*} text
         * @param {number} fontSize
         * @returns {number}
         */
        function estimateTextWidth(text, fontSize) {
          var size = fontSize || 12;
          var str = String(text === null || text === undefined ? "" : text);
          var w = 0;
          for (var i = 0; i < str.length; i++) {
            w += str.charCodeAt(i) > 0xff ? size : size * 0.6;
          }
          return Math.ceil(w);
        }

        /** XML-escapes a string for embedding in the node SVG markup. */
        function escapeXml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&apos;");
        }

        /** Matches the web app's color-format detection (hex/rgb/rgba strings). */
        function isColorFormat(colorString) {
          var hexCodeRegex = /^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$/;
          var rgbRegex = /^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/;
          var rgbaRegex = /^rgba\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(0|1|0\.\d+)\s*\)$/;
          return (
            hexCodeRegex.test(colorString) ||
            rgbRegex.test(colorString) ||
            rgbaRegex.test(colorString)
          );
        }

        /**
         * Text color for a value, mirroring the web app's getTextColor():
         * nulls gray, numbers amber, booleans green/red, strings white.
         * @param {{value: string, type: string}} row
         * @returns {string}
         */
        function valueColor(row) {
          if (row.type === "null") return "#939598";
          if (row.type === "number") return "#e8c479";
          if (row.type === "boolean") return row.value === "false" ? "#f85c50" : "#00dc7d";
          return "#dce5e7";
        }

        /**
         * Wraps node body markup with the shared rounded-rect backdrop,
         * matching the web app's node chrome: fill #292929, stroke #424242,
         * ~8px corner radius, monospace 12px/500 text.
         * @param {string} inner
         * @param {number} width
         * @param {number} height
         * @returns {string} raw SVG markup
         */
        function svgWrap(inner, width, height) {
          return (
            '<svg xmlns="http://www.w3.org/2000/svg" width="' +
            width +
            '" height="' +
            height +
            '" viewBox="0 0 ' +
            width +
            " " +
            height +
            '" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="500">' +
            '<rect x="0.5" y="0.5" width="' +
            (width - 1) +
            '" height="' +
            (height - 1) +
            '" rx="8" fill="#292929" stroke="#424242" stroke-width="1"/>' +
            inner +
            "</svg>"
          );
        }

        /**
         * Single-line text-node SVG (the web app's TextNode): used for the
         * root "[N items]" node and the "+N more rows" overflow marker.
         * @param {string} text
         * @param {number} width
         * @param {number} height
         * @param {string} [color]
         * @returns {string}
         */
        function nodeSvgSingle(text, width, height, color) {
          var body =
            '<text x="' +
            width / 2 +
            '" y="' +
            height / 2 +
            '" text-anchor="middle" dominant-baseline="central" fill="' +
            (color || "#dce5e7") +
            '">' +
            escapeXml(text) +
            "</text>";
          return svgWrap(body, width, height);
        }

        /**
         * Object-node SVG (the web app's ObjectNode): one "key: value" row per
         * column, keys in blue (#59b8ff), values colored by type, dividers
         * (#383838) between rows, 30px row height, 10px horizontal padding.
         * @param {{key: string | null, value: string, type: string}[]} rows
         * @param {number} width
         * @param {number} height
         * @returns {string}
         */
        function nodeSvgObject(rows, width, height) {
          var ROW_H = 30;
          var PAD_X = 10;
          var body = "";
          for (var i = 0; i < rows.length; i++) {
            var row = rows[i];
            var y = i * ROW_H + ROW_H / 2;
            var x = PAD_X;
            if (row.key) {
              body +=
                '<text x="' +
                x +
                '" y="' +
                y +
                '" dominant-baseline="central" fill="#59b8ff">' +
                escapeXml(row.key) +
                ": </text>";
              x += estimateTextWidth(row.key + ": ", 12);
            }
            if (isColorFormat(String(row.value))) {
              body +=
                '<rect x="' +
                x +
                '" y="' +
                (y - 6) +
                '" width="12" height="12" rx="3" fill="' +
                escapeXml(row.value) +
                '"/>';
              x += 16;
            }
            body +=
              '<text x="' +
              x +
              '" y="' +
              y +
              '" dominant-baseline="central" fill="' +
              valueColor(row) +
              '">' +
              escapeXml(row.value) +
              "</text>";
            if (i < rows.length - 1) {
              var dividerY = (i + 1) * ROW_H;
              body +=
                '<line x1="' +
                PAD_X +
                '" y1="' +
                dividerY +
                '" x2="' +
                (width - PAD_X) +
                '" y2="' +
                dividerY +
                '" stroke="#383838" stroke-width="1"/>';
            }
          }
          return svgWrap(body, width, height);
        }

        /**
         * Builds cytoscape elements mirroring the Nodex web app's rendering of
         * the same CSV: a root "[N items]" array node with one object node per
         * data row, each showing "key: value" rows colored by value type.
         *
         * @param {{headers: string[] | null, dataRows: string[][], totalRows: number}} table
         * @param {{maxCols?: number, maxRowsShown?: number, maxValueLen?: number}} opts
         * @returns {{nodes: object[], edges: object[]}} node data carries the raw
         *          SVG markup (svg) plus its pixel size (width, height)
         */
        function buildGraphElements(table, opts) {
          var options = opts || {};
          var maxCols = options.maxCols || 60;
          var maxRowsShown = options.maxRowsShown || 200;
          var maxValueLen = options.maxValueLen || 60;

          var headers = table.headers;
          var dataRows = table.dataRows;

          // Column count: max across headers and rows, capped like the web app.
          var colCount = 0;
          for (var r = 0; r < dataRows.length; r++) {
            if (dataRows[r].length > colCount) colCount = dataRows[r].length;
          }
          if (headers && headers.length > colCount) colCount = headers.length;
          colCount = Math.min(colCount, maxCols);

          var shown = Math.min(dataRows.length, maxRowsShown);
          var nodes = [];
          var edges = [];

          // Root array node — mirrors the web app's "[N items]" root.
          var rootLabel = "[" + dataRows.length + " items]";
          var rootW = estimateTextWidth(rootLabel, 12) + 28;
          nodes.push({
            data: {
              id: "root",
              kind: "root",
              svg: nodeSvgSingle(rootLabel, rootW, 34),
              width: rootW,
              height: 34,
            },
          });

          for (var i = 0; i < shown; i++) {
            var rows = [];
            var maxW = 0;
            for (var c = 0; c < colCount; c++) {
              var key = headers ? headers[c] : columnToLetter(c);
              var raw = dataRows[i][c] === undefined ? "" : dataRows[i][c];
              var display = truncate(raw, maxValueLen).replace(/[\r\n]+/g, " ");
              rows.push({ key: key, value: display, type: valueType(raw) });
              var rowW = estimateTextWidth(key + ": " + display, 12);
              // Color cells render a 12px swatch + 4px gap inside the node.
              if (isColorFormat(display)) rowW += 16;
              if (rowW > maxW) maxW = rowW;
            }
            if (rows.length === 0) {
              rows.push({ key: null, value: "(empty row)", type: "string" });
              maxW = estimateTextWidth("(empty row)", 12);
            }

            var id = "row-" + i;
            var w = maxW + 20;
            var h = rows.length * 30;
            nodes.push({
              data: {
                id: id,
                kind: "row",
                rowIndex: i,
                svg: nodeSvgObject(rows, w, h),
                width: w,
                height: h,
              },
            });
            edges.push({ data: { id: "edge-" + i, source: "root", target: id } });
          }

          // Overflow marker when the row cap hides data (muted metadata style).
          if (dataRows.length > shown) {
            var more = "… +" + (dataRows.length - shown) + " more rows";
            var moreW = estimateTextWidth(more, 12) + 28;
            nodes.push({
              data: {
                id: "overflow",
                kind: "overflow",
                svg: nodeSvgSingle(more, moreW, 34, "#8b8e90"),
                width: moreW,
                height: 34,
              },
            });
            edges.push({
              data: { id: "edge-overflow", source: "root", target: "overflow" },
            });
          }

          return { nodes: nodes, edges: edges };
        }

        /**
         * RFC 4180 serialization of a 2D array (used for re-export and testing).
         * @param {string[][]} rows
         * @returns {string}
         */
        function rowsToCsv(rows) {
          const lines = [];
          for (let r = 0; r < rows.length; r++) {
            const cells = [];
            for (let c = 0; c < rows[r].length; c++) {
              let cell = rows[r][c];
              if (cell === null || cell === undefined) {
                cell = "";
              } else {
                cell = String(cell);
              }
              if (/[",\r\n]/.test(cell)) {
                cell = '"' + cell.replace(/"/g, '""') + '"';
              }
              cells.push(cell);
            }
            lines.push(cells.join(","));
          }
          return lines.join("\r\n");
        }

        /**
         * Base64URL (RFC 4648 §5) encoding of a UTF-8 string.
         * @param {string} str
         * @returns {string}
         */
        function toBase64Url(str) {
          const bytes = new TextEncoder().encode(str);
          let bin = "";
          for (let i = 0; i < bytes.length; i++) {
            bin += String.fromCharCode(bytes[i]);
          }
          return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        /**
         * Returns a formula-safe CSV for file export: cells that start with a
         * spreadsheet formula character (=, +, -, @) get a single-quote prefix
         * so the file cannot execute formulas when opened in Excel/Sheets.
         *
         * @param {string} csv
         * @returns {string}
         */
        function sanitizeCsv(csv) {
          const rows = csvToRows(csv);
          for (let r = 0; r < rows.length; r++) {
            for (let c = 0; c < rows[r].length; c++) {
              const value = String(rows[r][c]);
              if (/^[=+\-@]/.test(value)) {
                rows[r][c] = "'" + value;
              }
            }
          }
          return rowsToCsv(rows);
        }

        return {
          csvToRows: csvToRows,
          columnToLetter: columnToLetter,
          dedupeHeaders: dedupeHeaders,
          normalizeTable: normalizeTable,
          truncate: truncate,
          valueType: valueType,
          estimateTextWidth: estimateTextWidth,
          escapeXml: escapeXml,
          isColorFormat: isColorFormat,
          valueColor: valueColor,
          svgWrap: svgWrap,
          nodeSvgSingle: nodeSvgSingle,
          nodeSvgObject: nodeSvgObject,
          buildGraphElements: buildGraphElements,
          rowsToCsv: rowsToCsv,
          toBase64Url: toBase64Url,
          sanitizeCsv: sanitizeCsv,
        };
      })();
    </script>

    <!--
      ─────────────────────────────────────────────────────────────
      UI GLUE — DOM, google.script.run bridge, cytoscape lifecycle.
      ─────────────────────────────────────────────────────────────
    -->
    <script>
      (function () {
        "use strict";

        var core = window.__nodexCore;

        // ── Configuration ────────────────────────────────────
        // Public URL of the deployed Nodex web app. Must be the exact origin of
        // the deployment (postMessage is origin-validated on both sides).
        var NODEX_APP_URL = "https://nodex-launch.vercel.app";

        // Browser-level window name for the deep-link tab: if a window with this
        // name is already open, window.open reuses it instead of opening a new
        // tab — even across sidebar sessions.
        var NODEX_WINDOW_NAME = "nodex-sheets-deeplink";

        // Deep links use a postMessage handshake (no URL-size limits), so even
        // very large selections can be handed to Nodex directly.

        // Graphs cap the number of row nodes at MAX_GRAPH_ROWS; selections
        // larger than that show an overflow marker, and the sidebar auto-
        // expands to give the big layout the full height.
        var MAX_GRAPH_ROWS = 200;

        // ── Preview / standalone modes ───────────────────────
        // Standalone pop-out window (?standalone=1 or #standalone=1): opened by
        // the sidebar's "Pop out" button — a large, freely resizable browser
        // window rendering the same visualization. Google Sheets fixes the
        // sidebar at ~300px with no resize API, so this is the escape hatch.
        var IS_STANDALONE =
          /[?&]standalone=1/.test(window.location.search) || /#standalone=1/.test(window.location.hash);
        // Preview mode (no Apps Script) — detect via query (?preview=1) or hash
        // (#preview=1); the hash variant is robust to servers that 301-strip
        // query strings. A standalone pop-out has no preview marker, but when
        // there is no Apps Script runtime it must behave like the demo anyway.
        var IS_PREVIEW =
          /[?&]preview=1/.test(window.location.search) ||
          /#preview=1/.test(window.location.hash) ||
          (IS_STANDALONE && typeof google === "undefined");
        var SAMPLE_CSV = [
          "Name,Department,Salary,Remote",
          'Ada Lovelace,"Engineering, AI",150000,true',
          "Alan Turing,Computer Science,120000,false",
          "Grace Hopper,Navy,130000,true",
          "Linus Torvalds,Linux,140000,true",
          "Margaret Hamilton,NASA,125000,false",
        ].join("\n");

        var state = {
          csv: "",
          sheetId: null,
          sheetName: "",
          rangeA1: "",
          startRow: 1,
          startCol: 1,
          rowCount: 0,
          colCount: 0,
          hasHeader: true,
        };

        // postMessage deep-link state (see openInNodex below)
        var targetWindow = null; // the Nodex tab we opened
        var nodexOrigin = ""; // origin of NODEX_APP_URL, validated on inbound messages
        var acked = false;

        // Standalone pop-out window state (see popOut below)
        var popWindow = null; // the standalone window we opened
        var popOrigin = ""; // origin of the standalone page (same as this page)
        var popAcked = false;

        // Once the user manually toggles the expand button, stop auto-managing
        // the layout so their choice is respected for the rest of the session.
        var userToggledExpand = false;

        var cy = null;

        // ── Helpers ──────────────────────────────────────────
        function $(id) {
          return document.getElementById(id);
        }

        function showToast(message, kind) {
          var el = $("toast");
          el.textContent = message;
          el.className = "toast" + (kind ? " " + kind : "");
          clearTimeout(showToast._t);
          showToast._t = setTimeout(function () {
            el.className = "toast hidden";
          }, 2600);
        }

        function setStatus(kind, message) {
          var el = $("status");
          if (!message) {
            el.className = "status hidden";
            return;
          }
          el.textContent = message;
          el.className = "status " + kind;
        }

        function svgDataUri(svg) {
          return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
        }

        function copyText(text, onOk) {
          var fallback = function () {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              onOk();
            } catch (e) {
              showToast("Copy failed — select the CSV manually.", "error");
            }
            document.body.removeChild(ta);
          };

          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(onOk, fallback);
          } else {
            fallback();
          }
        }

        /** Server bridge: real Apps Script in production, sample data in preview. */
        function callServer(fnName, args, onOk, onErr) {
          if (IS_PREVIEW) {
            setTimeout(function () {
              if (fnName === "getSelectionAsCsv") {
                // Preview mode: use the sample, or a custom CSV set via
                // __nodexSidebar.state.csv (e.g. to try a large table).
                var csv = state.csv || SAMPLE_CSV;
                var rows = core.csvToRows(csv);
                var cols = 0;
                rows.forEach(function (r) {
                  if (r.length > cols) cols = r.length;
                });
                var lastCol = core.columnToLetter(Math.max(0, cols - 1)) || "A";
                onOk({
                  csv: csv,
                  sheetName: "Sales",
                  rangeA1: "A1:" + lastCol + Math.max(1, rows.length),
                  startRow: 1,
                  startCol: 1,
                  rowCount: rows.length,
                  colCount: cols,
                  error: null,
                });
              } else {
                onOk(null);
              }
            }, 300);
            return;
          }
          if (typeof google === "undefined" || !google.script) {
            if (onErr) onErr("Apps Script runtime not available.");
            return;
          }
          google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr)[fnName].apply(
            null,
            args || []
          );
        }

        // ── Rendering ────────────────────────────────────────
        function escapeHtml(str) {
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function renderPreviewTable(table) {
          var body = $("previewBody");
          body.innerHTML = "";
          if (!table.dataRows.length && !table.headers) {
            body.innerHTML = '<div class="status empty">No rows to preview.</div>';
            return;
          }
          var colCount = 0;
          for (var r = 0; r < table.dataRows.length; r++) {
            if (table.dataRows[r].length > colCount) colCount = table.dataRows[r].length;
          }
          if (table.headers && table.headers.length > colCount) colCount = table.headers.length;
          if (colCount === 0) colCount = 1;

          var html = '<table><thead><tr>';
          for (var c = 0; c < colCount; c++) {
            var head = table.headers ? table.headers[c] : core.columnToLetter(c);
            html += "<th>" + escapeHtml(head) + "</th>";
          }
          html += "</tr></thead><tbody>";

          var MAX_PREVIEW_ROWS = 100;
          var shown = Math.min(table.dataRows.length, MAX_PREVIEW_ROWS);
          for (var ri = 0; ri < shown; ri++) {
            html += "<tr>";
            for (var ci = 0; ci < colCount; ci++) {
              var val = table.dataRows[ri][ci];
              html += "<td>" + escapeHtml(val === undefined ? "" : val) + "</td>";
            }
            html += "</tr>";
          }
          html += "</tbody></table>";
          body.innerHTML = html;
        }

        function runLayout() {
          if (!cy) return;
          var hasElk = typeof cytoscape("layout", "elk") === "function";
          var layout = cy.layout(
            hasElk
              ? {
                  name: "elk",
                  fit: false,
                  elk: {
                    algorithm: "layered",
                    "elk.direction": "RIGHT",
                    "elk.spacing.nodeNode": "28",
                    "elk.layered.spacing.nodeNodeBetweenLayers": "44",
                  },
                }
              : {
                  name: "breadthfirst",
                  directed: true,
                  spacingFactor: 1.1,
                  animate: false,
                }
          );
          // Fit once the layout settles so the graph fills the available space.
          // (Attach before run(): a synchronous fallback layout can fire
          // layoutstop during run(), before the handler would be registered.)
          cy.one("layoutstop", function () {
            if (cy) cy.fit(undefined, 40);
          });
          layout.run();
        }

        function initCy(elements) {
          cy = cytoscape({
            container: $("cy"),
            elements: elements,
            boxSelectionEnabled: false,
            autoungrabify: true,
            autounselectify: false,
            minZoom: 0.05,
            maxZoom: 4,
            wheelSensitivity: 0.3,
            // Nodes are rendered as SVG background images (built in the core
            // block) that replicate the web app's node look exactly: rounded
            // dark boxes, monospace key:value rows, type-colored values. The
            // cytoscape border is a transparent overlay used for hover/selected
            // highlights, matching the app's blue stroke on hover.
            style: [
              {
                selector: "node",
                style: {
                  shape: "rectangle",
                  "background-color": "transparent",
                  "background-image": "data(svg)",
                  "background-width": "data(width)",
                  "background-height": "data(height)",
                  "background-width-relative-to": "inner",
                  "background-height-relative-to": "inner",
                  width: "data(width)",
                  height: "data(height)",
                  "border-width": 1.5,
                  "border-color": "transparent",
                },
              },
              {
                selector: "node:selected",
                style: {
                  "border-color": "#3B82F6",
                },
              },
              {
                selector: "edge",
                style: {
                  width: 1.5,
                  "line-color": "#444444",
                  "curve-style": "straight",
                },
              },
            ],
          });

          cy.on("tap", "node", function (evt) {
            var node = evt.target;
            cy.nodes().unselect();
            if (node.data("kind") !== "row") return;
            node.select();
            callServer(
              "activateRow",
              [state.sheetId, state.startRow + node.data("rowIndex"), state.startCol, state.colCount],
              function () {},
              function () {}
            );
          });

          cy.on("mouseover", "node", function (evt) {
            evt.target.style("border-color", "#3B82F6");
          });
          cy.on("mouseout", "node", function (evt) {
            if (!evt.target.selected()) {
              evt.target.style("border-color", "transparent");
            }
          });
        }

        function renderGraph(precomputedTable) {
          if (!state.csv) return;
          var table = precomputedTable || core.normalizeTable(state.csv, state.hasHeader);
          var elements = core.buildGraphElements(table, { maxRowsShown: MAX_GRAPH_ROWS });
          elements.nodes.forEach(function (n) {
            n.data.svg = svgDataUri(n.data.svg);
          });

          $("cyWrap").classList.remove("hidden");

          if (!cy) {
            initCy(elements);
          } else {
            cy.elements().remove();
            cy.add(elements);
          }
          // Always run a layout: a fresh cytoscape instance leaves new nodes at
          // the default position (0,0), stacking them on top of each other.
          // Resize first — the container was hidden when a fresh instance was
          // created, so cytoscape's recorded size may still be 0×0.
          cy.resize();
          runLayout();
          var dimsText =
            state.rowCount + "×" + state.colCount +
            (state.sheetName && state.rangeA1 ? " · " + state.sheetName + "!" + state.rangeA1 : "");
          var hasOverflow = elements.nodes.some(function (n) {
            return n.data.kind === "overflow";
          });
          if (hasOverflow) {
            dimsText += " · showing first " + (elements.nodes.length - 2) + " rows";
          }
          $("dims").textContent = dimsText;
          $("rangeInfo").textContent = state.rangeA1
            ? state.sheetName + "!" + state.rangeA1
            : "";
          renderPreviewTable(table);
          $("preview").classList.remove("hidden");
        }

        /**
         * Toggles full-height graph mode (hides header/controls/preview/footer)
         * and keeps the expand button's label in sync.
         * @param {boolean} expanded
         */
        function setExpanded(expanded) {
          var app = document.getElementById("app");
          if (app.classList.contains("expanded") === expanded) return; // no-op
          app.classList.toggle("expanded", expanded);
          var btn = $("expandBtn");
          btn.title = expanded ? "Collapse graph" : "Expand graph";
          btn.setAttribute("aria-expanded", expanded ? "true" : "false");
          // Give the flex layout a frame to reflow, then let the graph fill it.
          setTimeout(function () {
            if (cy) {
              cy.resize();
              cy.fit(undefined, 40);
            }
          }, 60);
        }

        /**
         * Auto-manages the layout for the selection size: large tables (more
         * than MAX_GRAPH_ROWS data rows) expand the graph to full height and
         * close the table preview; smaller ones return to the normal layout.
         * Stops entirely once the user manually toggles the expand button.
         * @param {{dataRows: string[][]}} table
         */
        function applyAutoExpand(table) {
          if (userToggledExpand) return;
          var app = document.getElementById("app");
          var large = table.dataRows.length > MAX_GRAPH_ROWS;
          var wasExpanded = app.classList.contains("expanded");
          if (large && !wasExpanded) {
            $("preview").removeAttribute("open");
            setExpanded(true);
            showToast("Large selection \u2014 graph expanded (\u26F6 to restore).");
          } else if (!large && wasExpanded) {
            setExpanded(false);
          }
        }

        /**
         * Stores a selection payload in state and renders it. Used by both the
         * server bridge and the standalone pop-out window's postMessage input.
         * @param {{csv: string, sheetName?: string, rangeA1?: string, startRow?: number, startCol?: number, rowCount?: number, colCount?: number}} data
         */
        function renderData(data) {
          state.csv = data.csv || "";
          state.sheetId = data.sheetId != null ? data.sheetId : null;
          state.sheetName = data.sheetName || "";
          state.rangeA1 = data.rangeA1 || "";
          state.startRow = data.startRow || 1;
          state.startCol = data.startCol || 1;
          state.rowCount = data.rowCount || 0;
          state.colCount = data.colCount || 0;
          setStatus(null);
          var table = core.normalizeTable(state.csv, state.hasHeader);
          renderGraph(table);
          if (!IS_STANDALONE) applyAutoExpand(table);
          if (IS_STANDALONE) {
            document.title = "Nodex — " + (state.sheetName || "Visualization");
          }
        }

        function loadSelection() {
          if (IS_STANDALONE) {
            // Standalone window: the opener (sidebar "Pop out") hands the CSV
            // over via postMessage. Until it arrives, re-render whatever we
            // already have, and fall back to reading the selection ourselves
            // (production) or the sample (preview) after a short grace period.
            setStatus("loading", "Waiting for data…");
            if (state.csv) renderGraph();
            clearTimeout(loadSelection._t);
            loadSelection._t = setTimeout(function () {
              if (state.csv) return;
              if (!IS_PREVIEW) {
                callServer(
                  "getSelectionAsCsv",
                  [],
                  function (data) {
                    if (data && data.error) setStatus("error", data.error);
                    else if (data && !state.csv) renderData(data);
                  },
                  function (err) {
                    setStatus(
                      "error",
                      String((err && err.message) || err || "Failed to read selection.")
                    );
                  }
                );
              } else {
                renderData({
                  csv: SAMPLE_CSV,
                  sheetName: "Sales",
                  rangeA1: "A1:E6",
                  startRow: 1,
                  startCol: 1,
                  rowCount: 6,
                  colCount: 5,
                });
                showToast("Sample data — use the sidebar's Pop out for your selection.");
              }
            }, 4000);
            return;
          }

          setStatus("loading", "Reading selected range…");
          callServer(
            "getSelectionAsCsv",
            [],
            function (data) {
              if (data && data.error) {
                state.csv = "";
                setStatus("error", data.error);
                $("cyWrap").classList.add("hidden");
                $("preview").classList.add("hidden");
                return;
              }
              renderData(data);
            },
            function (err) {
              setStatus("error", String((err && err.message) || err || "Failed to read selection."));
            }
          );
        }

        // ── Actions ──────────────────────────────────────────
        /**
         * Sends the current selection to the Nodex tab via postMessage.
         * Re-sends on every "ready" until the app acks: the first attempt often
         * races a cold-starting tab (its listener isn't mounted yet), and the
         * app announces readiness precisely to cover that case. The ack ends
         * the loop, so duplicates are bounded and the import is idempotent.
         */
        function sendToNodex() {
          if (!state.csv || !targetWindow || targetWindow.closed || acked) return;
          targetWindow.postMessage(
            {
              type: "nodex-sheets",
              source: "nodex-sheets-addon",
              csv: state.csv,
            },
            nodexOrigin
          );
        }

        /**
         * Opens the Nodex web app in a new tab and hands it the selection over
         * postMessage (no URL-size limits). Falls back to copying the CSV if
         * the app never confirms receipt or the popup is blocked.
         */
        function openInNodex() {
          if (!state.csv) return;

          if (!NODEX_APP_URL) {
            showToast(
              "Set NODEX_APP_URL in Sidebar.html to open Nodex \u2014 CSV copied instead.",
              "error"
            );
            copyText(state.csv, function () {
              showToast("CSV copied to clipboard.", "ok");
            });
            return;
          }

          try {
            nodexOrigin = new URL(NODEX_APP_URL).origin;
          } catch (e) {
            showToast("NODEX_APP_URL is not a valid URL \u2014 CSV copied instead.", "error");
            copyText(state.csv, function () {
              showToast("CSV copied to clipboard.", "ok");
            });
            return;
          }
          // Reuse an already-open Nodex tab when possible. First check the tab
          // this sidebar opened — if it's still alive, just focus it and hand
          // over the data (no reload). Otherwise open a named window, which the
          // browser reuses across sidebar sessions.
          if (targetWindow && !targetWindow.closed) {
            targetWindow.focus();
          } else {
            targetWindow = window.open(NODEX_APP_URL, NODEX_WINDOW_NAME);
            if (!targetWindow) {
              showToast("Popup blocked \u2014 CSV copied instead.", "error");
              copyText(state.csv, function () {
                showToast("CSV copied to clipboard.", "ok");
              });
              return;
            }
          }

          acked = false;

          // Try immediately (in case the app already has a listener) and ping
          // the handshake — the app replies "ready" once it is listening, which
          // triggers sendToNodex() again. Keep pinging until the app confirms,
          // so a cold-starting tab (no listener yet) still receives the data.
          // (Toast once here — re-sends on "ready" don't re-toast.)
          showToast("Sending data to Nodex\u2026");
          sendToNodex();
          targetWindow.postMessage(
            { type: "nodex-sheets", status: "ping" },
            nodexOrigin
          );
          clearInterval(openInNodex._ping);
          openInNodex._ping = setInterval(function () {
            if (acked || !targetWindow || targetWindow.closed) {
              clearInterval(openInNodex._ping);
              return;
            }
            targetWindow.postMessage(
              { type: "nodex-sheets", status: "ping" },
              nodexOrigin
            );
          }, 1000);

          // If the app never confirms receipt, don't lose the data: hand it
          // over via the app's ?csv= deep link when it fits in a URL, else
          // copy it to the clipboard.
          clearTimeout(openInNodex._t);
          openInNodex._t = setTimeout(function () {
            clearInterval(openInNodex._ping);
            if (acked) return;
            var MAX_LINK_CSV_CHARS = 45000; // keeps the encoded URL well under browser limits
            var viaLink =
              targetWindow && !targetWindow.closed && state.csv.length <= MAX_LINK_CSV_CHARS;
            if (viaLink) {
              targetWindow.location.href = NODEX_APP_URL + "?csv=" + core.toBase64Url(state.csv);
            }
            copyText(state.csv, function () {
              showToast(
                viaLink
                  ? "Opened Nodex with your data \u2014 CSV copied as backup."
                  : "Nodex didn't confirm \u2014 CSV copied to clipboard.",
                viaLink ? "ok" : "error"
              );
            });
          }, 12000);
        }

        /**
         * Sends the current selection to the standalone pop-out window (same
         * origin as this page). Re-sends on "ready" until the window acks,
         * mirroring the Nodex deep-link handshake.
         */
        function sendToPopWindow() {
          if (!state.csv || !popWindow || popWindow.closed || popAcked) return;
          popWindow.postMessage(
            {
              type: "nodex-sheets",
              source: "nodex-sheets-addon",
              mode: "standalone",
              csv: state.csv,
              sheetName: state.sheetName,
              rangeA1: state.rangeA1,
              startRow: state.startRow,
              startCol: state.startCol,
              rowCount: state.rowCount,
              colCount: state.colCount,
            },
            popOrigin
          );
        }

        /**
         * "Pop out": opens the same visualization in a large, freely resizable
         * browser window. Google Sheets pins the sidebar at ~300px with no API
         * to widen it, so this is the escape hatch for big canvases. The
         * standalone page is this same file with #standalone=1 — no server
         * round trip: we hand it the CSV over postMessage and it acks.
         */
        function popOut() {
          if (!state.csv) return;

          popOrigin = window.location.origin;
          popAcked = false;

          if (popWindow && !popWindow.closed) {
            popWindow.focus();
          } else {
            var url = window.location.href.split("#")[0] + "#standalone=1";
            popWindow = window.open(url, "nodex-sheets-standalone");
            if (!popWindow) {
              showToast("Popup blocked — CSV copied instead.", "error");
              copyText(state.csv, function () {});
              return;
            }
          }

          showToast("Opening visualization…");
          sendToPopWindow();
          clearInterval(popOut._ping);
          popOut._ping = setInterval(function () {
            if (popAcked || !popWindow || popWindow.closed) {
              clearInterval(popOut._ping);
              return;
            }
            popWindow.postMessage(
              { type: "nodex-sheets", status: "ping", mode: "standalone" },
              popOrigin
            );
          }, 800);

          clearTimeout(popOut._t);
          popOut._t = setTimeout(function () {
            clearInterval(popOut._ping);
            if (popAcked) return;
            copyText(state.csv, function () {
              showToast("Couldn't reach the popup window — CSV copied to clipboard.", "error");
            });
          }, 8000);
        }

        function downloadCsv() {
          if (!state.csv) return;
          var base = (state.sheetName || "nodex").replace(/[^\w-]+/g, "_");
          var blob = new Blob(["\uFEFF" + core.sanitizeCsv(state.csv)], {
            type: "text/csv;charset=utf-8",
          });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = base + ".csv";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(a.href);
        }

        // ── Wiring ───────────────────────────────────────────
        $("refreshBtn").addEventListener("click", loadSelection);
        $("hasHeader").addEventListener("change", function () {
          state.hasHeader = this.checked;
          if (state.csv) renderGraph();
        });
        $("openNodexBtn").addEventListener("click", openInNodex);
        $("popOutBtn").addEventListener("click", popOut);
        $("copyCsvBtn").addEventListener("click", function () {
          if (!state.csv) return;
          copyText(state.csv, function () {
            showToast("CSV copied to clipboard.", "ok");
          });
        });
        $("downloadCsvBtn").addEventListener("click", downloadCsv);
        $("fitBtn").addEventListener("click", function () {
          if (cy) cy.fit(undefined, 40);
        });
        $("zoomInBtn").addEventListener("click", function () {
          if (cy) cy.zoom(cy.zoom() * 1.25);
        });
        $("zoomOutBtn").addEventListener("click", function () {
          if (cy) cy.zoom(cy.zoom() * 0.8);
        });
        $("expandBtn").addEventListener("click", function () {
          userToggledExpand = true; // take over from auto-managed layout
          var app = document.getElementById("app");
          setExpanded(!app.classList.contains("expanded"));
        });

        // Opening/closing the preview changes the graph area — cytoscape only
        // auto-resizes on window resize, so tell it explicitly.
        document.querySelector("#preview summary").addEventListener("click", function () {
          setTimeout(function () {
            if (cy) cy.resize();
          }, 50);
        });

        // Standalone windows can be resized freely — keep the graph fitted.
        if (IS_STANDALONE) {
          var onWindowResize = function () {
            clearTimeout(onWindowResize._t);
            onWindowResize._t = setTimeout(function () {
              if (cy) {
                cy.resize();
                cy.fit(undefined, 40);
              }
            }, 120);
          };
          window.addEventListener("resize", onWindowResize);
        }

        // Drag the divider above the preview table to resize it vertically.
        $("previewHandle").addEventListener("pointerdown", function (evt) {
          evt.preventDefault();
          var startY = evt.clientY;
          var startH = $("preview").offsetHeight;
          var onMove = function (e) {
            var h = startH + (startY - e.clientY);
            h = Math.max(60, Math.min(h, Math.floor(window.innerHeight * 0.5)));
            $("preview").style.setProperty("--ph", h + "px");
            if (cy) cy.resize();
          };
          var onUp = function () {
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
        });

        // Debug / preview hooks (used by sidebar-preview.html tooling and tests).
        window.__nodexSidebar = {
          state: state,
          reload: loadSelection,
          toggleExpand: function () {
            $("expandBtn").click();
          },
          isExpanded: function () {
            return document.getElementById("app").classList.contains("expanded");
          },
          graphInfo: function () {
            if (!cy) return null;
            var root = cy.getElementById("root");
            return {
              nodes: cy.nodes().length,
              edges: cy.edges().length,
              kinds: cy.nodes().map(function (n) {
                return n.data("kind");
              }),
              rootSvg: root && root.length > 0 ? root.data("svg") : null,
              rowIndices: cy.nodes().map(function (n) {
                return n.data("rowIndex");
              }),
            };
          },
          forceRender: function () {
            if (cy) cy.forceRender();
          },
          isStandalone: function () {
            return IS_STANDALONE;
          },
          positions: function () {
            if (!cy) return null;
            return cy.nodes().map(function (n) {
              return {
                id: n.id(),
                kind: n.data("kind"),
                x: Math.round(n.position("x")),
                y: Math.round(n.position("y")),
              };
            });
          },
        };

        // ── postMessage deep-link handshake ─────────────────
        // The Nodex app replies to our messages; only trust the configured origin.
        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || typeof data !== "object" || data.type !== "nodex-sheets") return;
          if (event.origin !== nodexOrigin) return;

          if (data.status === "ready" && targetWindow && !targetWindow.closed) {
            sendToNodex();
          } else if (data.status === "loaded") {
            acked = true;
            clearTimeout(openInNodex._t);
            clearInterval(openInNodex._ping);
            showToast("Data loaded in Nodex.", "ok");
          }
        });

        // Sidebar role: the standalone pop-out window confirms readiness and
        // acks receipt. Only listen when this page is the sidebar (the
        // standalone page itself uses the listener below).
        if (!IS_STANDALONE) {
          window.addEventListener("message", function (event) {
            var data = event.data;
            if (!data || typeof data !== "object" || data.type !== "nodex-sheets") return;
            if (event.origin !== popOrigin || data.mode !== "standalone") return;

            if (data.status === "ready") {
              sendToPopWindow();
            } else if (data.status === "loaded") {
              popAcked = true;
              clearTimeout(popOut._t);
              clearInterval(popOut._ping);
              showToast("Visualization opened in a new window.", "ok");
            }
          });
        }

        // Standalone role: the sidebar pings this window, we confirm readiness,
        // it hands over the CSV, we render and ack.
        if (IS_STANDALONE) {
          window.addEventListener("message", function (event) {
            var data = event.data;
            if (!data || typeof data !== "object" || data.type !== "nodex-sheets") return;
            if (data.mode !== "standalone") return;
            if (event.origin !== location.origin) return;

            if (data.status === "ping") {
              if (event.source) {
                event.source.postMessage(
                  { type: "nodex-sheets", status: "ready", mode: "standalone" },
                  event.origin
                );
              }
              return;
            }

            if (typeof data.csv === "string" && data.csv) {
              clearTimeout(loadSelection._t);
              renderData(data);
              if (event.source) {
                event.source.postMessage(
                  { type: "nodex-sheets", status: "loaded", mode: "standalone" },
                  event.origin
                );
              }
            }
          });
        }

        // ── Boot ─────────────────────────────────────────────
        if (IS_STANDALONE) document.body.classList.add("standalone");

        if (!IS_PREVIEW && typeof google === "undefined") {
          setStatus(
            "error",
            "This file must be opened through Google Sheets (Nodex menu), or with ?preview=1 for a demo."
          );
          return;
        }
        loadSelection();
      })();
    </script>
  </body>
</html>
